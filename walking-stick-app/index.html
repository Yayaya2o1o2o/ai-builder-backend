<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Guide Stick">
  <title>Guide Stick</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p id="status" class="status" aria-hidden="true">Tap the big button to start</p>
    <p id="detail" class="detail" aria-hidden="true"></p>

    <button id="main" class="main-button" type="button"
            aria-label="Start guiding. Double tap to start.">
      START
    </button>

    <div class="row">
      <button id="repeat" class="small-button" type="button"
              aria-label="What is ahead? Repeats the last message.">
        What's ahead?
      </button>
      <button id="units" class="small-button" type="button"
              aria-label="Distance unit: steps. Double tap to change.">
        Unit: steps
      </button>
    </div>
    <div class="row">
      <button id="stick" class="small-button" type="button"
              aria-label="Connect stick sensor. Optional, for more accurate distance.">
        Connect stick sensor
      </button>
      <button id="help" class="small-button" type="button"
              aria-label="Help. Explains how to use the app.">
        Help
      </button>
    </div>

    <!-- Camera preview for sighted helpers only. -->
    <div class="preview" aria-hidden="true">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
